; AFORO staging processes — supervisor. Install as
; /etc/supervisor/conf.d/aforo-staging.conf, then
;   supervisorctl reread && supervisorctl update aforo-staging
; Every program runs as the unprivileged `aforo` user (never root) from the
; `current` release. Restart ONLY this group after a deploy:
;   supervisorctl restart aforo-staging:*
; (never `supervisorctl restart all`, never `php artisan queue:restart` on a
; shared host, never pkill.) See docs/staging-runbook.md §3.4.
;
; Timing contract (config/queue.php + app/Jobs/SendDayCloseWhatsApp.php):
;   --timeout 30  <  DB_QUEUE_RETRY_AFTER 90  ;  stopwaitsecs 40 > --timeout
; so a job is never handed to a second worker while the first still runs,
; and a stop/restart lets the current job finish.

[group:aforo-staging]
programs=aforo-staging-reverb,aforo-staging-realtime,aforo-staging-mail,aforo-staging-whatsapp

[program:aforo-staging-reverb]
command=/usr/bin/php /srv/aforo-staging/api/current/artisan reverb:start --host=127.0.0.1 --port=8081 --no-interaction
directory=/srv/aforo-staging/api/current
user=aforo
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
; Reverb keeps one file descriptor per WebSocket.
minfds=10000
stdout_logfile=/srv/aforo-staging/api/shared/storage/logs/supervisor-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; Realtime broadcasts (BROADCAST_QUEUE=realtime): short, frequent.
[program:aforo-staging-realtime]
command=/usr/bin/php /srv/aforo-staging/api/current/artisan queue:work database --queue=realtime --name=aforo-staging-realtime --sleep=1 --tries=3 --backoff=5 --timeout=30 --max-time=3600 --no-interaction
directory=/srv/aforo-staging/api/current
user=aforo
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=40
stdout_logfile=/srv/aforo-staging/api/shared/storage/logs/supervisor-realtime.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; Invitation / password-reset e-mail (AFORO_MAIL_QUEUE=mail). Jobs are
; encrypted (ShouldBeEncrypted); retries resend the SAME link.
[program:aforo-staging-mail]
command=/usr/bin/php /srv/aforo-staging/api/current/artisan queue:work database --queue=mail --name=aforo-staging-mail --sleep=3 --tries=3 --backoff=30 --timeout=30 --max-time=3600 --no-interaction
directory=/srv/aforo-staging/api/current
user=aforo
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=40
stdout_logfile=/srv/aforo-staging/api/shared/storage/logs/supervisor-mail.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; Cierre Diario WhatsApp (WHATSAPP_QUEUE=whatsapp). EXACTLY one process:
; the job is at-most-once by its own claim logic; tries/backoff come from
; the job class (3 attempts, 60 s / 300 s, only for Meta's transient codes).
[program:aforo-staging-whatsapp]
command=/usr/bin/php /srv/aforo-staging/api/current/artisan queue:work database --queue=whatsapp --name=aforo-staging-whatsapp --sleep=3 --tries=3 --timeout=30 --max-time=3600 --no-interaction
directory=/srv/aforo-staging/api/current
user=aforo
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=40
stdout_logfile=/srv/aforo-staging/api/shared/storage/logs/supervisor-whatsapp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
