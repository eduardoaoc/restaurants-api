# AFORO API + Reverb (wss) — STAGING. nginx server block.
# Install: /etc/nginx/sites-available/aforo-api-staging.conf, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx` (reload only).
# Replace every CHANGE_ME. See docs/staging-runbook.md §3.
#
# Layout: /srv/aforo-staging/api/{releases/<id>,shared,current -> releases/<id>}
# PHP-FPM pool socket: /run/php/aforo-staging.sock (runbook §3.3), user aforo.

map $http_upgrade $aforo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-staging.conejocreative.com;

    # ACME HTTP-01 challenge (certbot --webroot), everything else -> HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-staging.conejocreative.com;

    ssl_certificate     /etc/letsencrypt/live/api-staging.conejocreative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.conejocreative.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Document root is public/ of the CURRENT release, never the project root.
    # $realpath_root makes PHP-FPM/opcache see the new release after the
    # `current` symlink switch without a global FPM reload.
    root /srv/aforo-staging/api/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Product media upload limit (config/media.php) + headroom.
    client_max_body_size 25m;

    access_log /var/log/nginx/aforo-api-staging.access.log;
    error_log  /var/log/nginx/aforo-api-staging.error.log warn;

    # Never serve dotfiles (.env, .git, .htaccess) or internal files, even if
    # one ends up under public/ by mistake.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
    location ~* \.(env|log|sql|dump|bak|backup|sqlite|ini|sh|yml|yaml|lock|md)$ {
        deny all;
        return 404;
    }

    # Reverb: browser WebSocket (/app/{key}) and the server-side HTTP API
    # (/apps/{id}/events, signed with REVERB_APP_SECRET). Reverb listens on
    # 127.0.0.1:8081 only; origins are enforced by REVERB_ALLOWED_ORIGINS.
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aforo_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded product media (storage:link -> shared/storage/app/public).
    location ^~ /storage/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass unix:/run/php/aforo-staging.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # FastCGI is not an HTTP proxy hop: REMOTE_ADDR is the real client
        # and HTTPS=on marks the request secure, so TRUSTED_PROXIES stays
        # empty and client-sent X-Forwarded-* headers are ignored. Only a
        # CDN/load balancer IN FRONT of nginx would need TRUSTED_PROXIES.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ {
        return 404;
    }
}
